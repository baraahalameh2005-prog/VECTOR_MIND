<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المرشد الأكاديمي الذكي</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --text: #1d2733; --muted: #66727f; --border: #dfe4ea;
    --brand: #0f5c4d; --brand-text: #ffffff; --user: #e3f1ed;
    --bot: #ffffff; --refused-bg: #fff4e5; --refused-border: #f0b45b; --refused-text: #7a4b00;
    --error-bg: #fdecec; --error-text: #8a1c1c; --chip: #eef2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171c; --panel: #1a2128; --text: #e6ebf0; --muted: #9aa6b2; --border: #2c363f;
      --brand: #3fa58e; --brand-text: #0d1512; --user: #1f3a33;
      --bot: #1a2128; --refused-bg: #3a2c14; --refused-border: #b9862f; --refused-text: #f3d39b;
      --error-bg: #3d1d1d; --error-text: #f5b5b5; --chip: #232c35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-size: 16px; line-height: 1.7; }
  .app { max-width: 820px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 12px;
           border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 1.25rem; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
  .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 10px;
         padding: 8px 14px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--brand); }
  .btn.primary { background: var(--brand); color: var(--brand-text); border-color: var(--brand); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  #chat { flex: 1; padding: 18px 0; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 88%; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border); white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-start; background: var(--user); border-color: transparent; }
  .msg.bot { align-self: flex-end; background: var(--bot); }
  .msg.refused { background: var(--refused-bg); border-color: var(--refused-border); color: var(--refused-text); }
  .msg.error { background: var(--error-bg); border-color: transparent; color: var(--error-text); }
  .msg .label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 4px; }
  .msg.refused .label { color: var(--refused-text); }
  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: .85rem; white-space: normal; }
  .sources b { display: block; margin-bottom: 4px; }
  .source { display: inline-block; background: var(--chip); border-radius: 8px; padding: 2px 8px; margin: 2px 0 2px 6px;
            direction: ltr; unicode-bidi: isolate; }
  .thinking { color: var(--muted); }
  .thinking::after { content: "…"; animation: dots 1.2s steps(3) infinite; }
  @keyframes dots { 0% { content: "."; } 50% { content: ".."; } 100% { content: "…"; } }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 10px; }
  .samples .btn { font-size: .9rem; padding: 6px 12px; }
  form { display: flex; gap: 8px; padding: 12px 0 20px; position: sticky; bottom: 0; background: var(--bg); }
  #q { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
       background: var(--panel); color: var(--text); font: inherit; }
  #q:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .empty { color: var(--muted); text-align: center; margin: auto 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>المرشد الأكاديمي الذكي</h1>
      <p>جامعة الخليل — كلية تكنولوجيا المعلومات · علم الحاسوب، وعلم الحاسوب / فرعي إدارة أعمال</p>
    </div>
    <button class="btn" id="new" type="button">جديد</button>
  </header>

  <div id="chat"><p class="empty" id="empty">اسأل عن الخطة الدراسية أو المساقات أو الأنظمة الأكاديمية. الإجابات من المستندات الرسمية فقط، مع ذكر المصدر.</p></div>

  <div class="samples" id="samples">
    <button class="btn" type="button">كم ساعة بقدر أسجل بالفصل؟</button>
    <button class="btn" type="button">شو المتطلب السابق لمساق برمجة الويب 1؟</button>
    <button class="btn" type="button">شو المساقات بالسنة الأولى الفصل الأول لعلم الحاسوب؟</button>
    <button class="btn" type="button">شو شروط لوحة الشرف؟</button>
  </div>

  <form id="form">
    <input id="q" autocomplete="off" placeholder="اكتب سؤالك هنا…" aria-label="سؤالك">
    <button class="btn primary" id="send" type="submit">إرسال</button>
  </form>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");
  let history = [];
  let busy = false;

  function add(cls, label, text) {
    document.getElementById("empty")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + cls;
    const l = document.createElement("span");
    l.className = "label"; l.textContent = label;
    const body = document.createElement("div");
    body.textContent = text;
    div.append(l, body);
    chat.append(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  function setBusy(on) {
    busy = on;
    send.disabled = on; input.disabled = on;
    document.querySelectorAll("#samples .btn").forEach(b => b.disabled = on);
  }

  async function askQuestion(question) {
    if (busy || !question.trim()) return;
    add("user", "أنت", question);
    const pending = add("bot", "المرشد", "");
    pending.lastChild.className = "thinking";
    pending.lastChild.textContent = "جاري البحث في المستندات";
    setBusy(true);
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });
      const data = await res.json();
      pending.remove();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));

      const refused = data.status === "refused";
      const msg = add(refused ? "bot refused" : "bot", refused ? "المرشد — لا توجد معلومة كافية" : "المرشد", data.answer);
      if (data.sources && data.sources.length) {
        const box = document.createElement("div");
        box.className = "sources";
        const t = document.createElement("b"); t.textContent = "المصادر:";
        box.append(t);
        data.sources.forEach(s => {
          const chip = document.createElement("span");
          chip.className = "source";
          chip.textContent = `${s.source} — p.${s.page}`;
          box.append(chip);
        });
        msg.append(box);
      }
      history.push({ question, answer: data.answer });
      history = history.slice(-4);
    } catch (err) {
      pending.remove();
      add("error", "خطأ", "تعذّر الحصول على إجابة: " + err.message);
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = input.value;
    input.value = "";
    askQuestion(q);
  });
  document.querySelectorAll("#samples .btn").forEach(b => b.addEventListener("click", () => askQuestion(b.textContent)));
  document.getElementById("new").addEventListener("click", () => {
    if (busy) return;
    history = [];
    chat.innerHTML = "";
    const p = document.createElement("p");
    p.className = "empty"; p.id = "empty";
    p.textContent = "بدأت محادثة جديدة. اكتب سؤالك.";
    chat.append(p);
    input.focus();
  });
</script>
</body>
</html>
